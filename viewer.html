<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exploded Car Animation - Frame Viewer</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(22, 27, 46, 0.85);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #151d38, var(--bg));
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fff, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 720px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    .viewport {
      position: relative;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 9 / 16;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px var(--accent-glow);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .viewport img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
    }

    .frame-badge {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-family: monospace;
      color: var(--accent);
      font-weight: 600;
    }

    .controls {
      width: 100%;
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      height: 6px;
      cursor: pointer;
    }

    .btn-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    button:hover {
      background: var(--accent);
      color: #0b0f19;
      box-shadow: 0 0 15px var(--accent-glow);
      border-color: var(--accent);
    }

    .speed-select {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      cursor: pointer;
      outline: none;
    }

    .info-footer {
      margin-top: 14px;
      font-size: 0.82rem;
      color: var(--text-muted);
      text-align: center;
    }

    .shortcuts {
      margin-top: 16px;
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    kbd {
      background: rgba(255,255,255,0.12);
      padding: 2px 6px;
      border-radius: 4px;
      color: #fff;
    }
  </style>
</head>
<body>

  <header>
    <h1>Exploded Car Frame Studio</h1>
    <p class="subtitle">192 Full HD (1080×1920) Extracted Frames • 24 FPS Disassembly Sequence</p>
  </header>

  <div class="container">
    <div class="viewport">
      <img id="frameDisplay" src="frames/frame_0001.png" alt="Car Frame">
      <div class="frame-badge" id="frameBadge">0001 / 0192</div>
    </div>

    <div class="controls">
      <div class="slider-row">
        <span style="font-family: monospace; font-size: 0.85rem;">01</span>
        <input type="range" id="frameSlider" min="1" max="192" value="1" step="1">
        <span style="font-family: monospace; font-size: 0.85rem;">192</span>
      </div>

      <div class="btn-row">
        <button id="prevBtn" title="Previous frame (Left Arrow)">◀ Prev</button>
        <button id="playBtn" title="Play / Pause (Spacebar)">▶ Play</button>
        <button id="nextBtn" title="Next frame (Right Arrow)">Next ▶</button>
        <select class="speed-select" id="speedSelect" title="Playback Speed">
          <option value="60">0.5x Speed</option>
          <option value="41" selected>1.0x Speed (24 FPS)</option>
          <option value="20">2.0x Speed</option>
        </select>
        <button id="downloadBtn" title="Save current frame">⬇ Save Frame</button>
      </div>

      <div class="shortcuts">
        <span><kbd>Space</kbd> Play / Pause</span>
        <span><kbd>←</kbd> <kbd>→</kbd> Step Frame</span>
        <span><kbd>Home</kbd> / <kbd>End</kbd> First / Last</span>
      </div>
    </div>
  </div>

  <div class="info-footer">
    Source: <code>Car_components_hovering_in_mid-air_20260929195029.mp4</code>
  </div>

  <script>
    const TOTAL_FRAMES = 192;
    const img = document.getElementById("frameDisplay");
    const slider = document.getElementById("frameSlider");
    const badge = document.getElementById("frameBadge");
    const playBtn = document.getElementById("playBtn");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const speedSelect = document.getElementById("speedSelect");
    const downloadBtn = document.getElementById("downloadBtn");

    let currentFrame = 1;
    let isPlaying = false;
    let intervalId = null;

    function formatNumber(num) {
      return String(num).padStart(4, "0");
    }

    function setFrame(frameNum) {
      currentFrame = Math.max(1, Math.min(TOTAL_FRAMES, frameNum));
      const formatted = formatNumber(currentFrame);
      img.src = `frames/frame_${formatted}.png`;
      slider.value = currentFrame;
      badge.textContent = `${formatted} / ${formatNumber(TOTAL_FRAMES)}`;
    }

    function play() {
      if (isPlaying) return;
      isPlaying = true;
      playBtn.textContent = "⏸ Pause";
      const delay = parseInt(speedSelect.value, 10);
      intervalId = setInterval(() => {
        let next = currentFrame + 1;
        if (next > TOTAL_FRAMES) next = 1;
        setFrame(next);
      }, delay);
    }

    function pause() {
      isPlaying = false;
      playBtn.textContent = "▶ Play";
      if (intervalId) {
        clearInterval(intervalId);
        intervalId = null;
      }
    }

    function togglePlay() {
      if (isPlaying) pause();
      else play();
    }

    slider.addEventListener("input", (e) => {
      pause();
      setFrame(parseInt(e.target.value, 10));
    });

    prevBtn.addEventListener("click", () => {
      pause();
      setFrame(currentFrame - 1);
    });

    nextBtn.addEventListener("click", () => {
      pause();
      setFrame(currentFrame + 1);
    });

    playBtn.addEventListener("click", togglePlay);

    speedSelect.addEventListener("change", () => {
      if (isPlaying) {
        pause();
        play();
      }
    });

    downloadBtn.addEventListener("click", () => {
      const link = document.createElement("a");
      link.href = img.src;
      link.download = `exploded_car_frame_${formatNumber(currentFrame)}.png`;
      link.click();
    });

    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        togglePlay();
      } else if (e.code === "ArrowLeft") {
        pause();
        setFrame(currentFrame - 1);
      } else if (e.code === "ArrowRight") {
        pause();
        setFrame(currentFrame + 1);
      } else if (e.code === "Home") {
        pause();
        setFrame(1);
      } else if (e.code === "End") {
        pause();
        setFrame(TOTAL_FRAMES);
      }
    });

    // Preload next few frames for ultra-smooth playback
    let preloaded = 0;
    function preload() {
      for (let i = 1; i <= Math.min(30, TOTAL_FRAMES); i++) {
        const preImg = new Image();
        preImg.src = `frames/frame_${formatNumber(i)}.png`;
      }
    }
    preload();
  </script>
</body>
</html>
